<chapter style="counter-reset: chapter 3"><h1>Things to remember</h1>
  <ul>
    <li>Don't set blade height too high.</li>
    <li>Don't push against the blade. Push downwards, towards the fence and straight on, keeping hands always before the blade.</li>
    <li>Don't cut wood that's wider than the length without a mitre gauge.</li>
    <li>Setup out feed collectors.</li>
  </ul>
</chapter>
