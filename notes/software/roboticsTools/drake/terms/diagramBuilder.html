<chapter style="counter-reset: chapter 0"><h1>DiagramBuilder</h1>
  A DiagramBuilder assembles many Drake systems into one larger system. The class is used to:
  <ul>
    <li><code>AddSystem()</code>s </li>
    <li><code>Connect()</code> input ports to output ports or to expose them as inputs/outputs of a diagram.</li>
  </ul>
   
  <code>Build()</code> is then used to create the finished diagram.
