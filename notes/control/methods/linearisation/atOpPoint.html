<chapter style="counter-reset: chapter 0"><h1>At operating point</h1>
  $$
    f_{lin}(x^*) == f(x^*)
  $$

  <subsubsection><h1>Proof</h1>
    Evaluating the system exactly at the operating point by substituting $x = x^*$:
    $$\Delta{x} = x^* - x^* = 0$$
    
    The second term drops out in the linearisation equation leaving the above equality.
  </subsubsection>
