<chapter style="counter-reset: chapter 0"><h1>At operating point</h1>
  $$
    f_{lin}(x_{op}) == f(x_{op})
  $$

  <subsubsection><h1>Proof</h1>
    Evaluating the system exactly at the operating point by substituting $x = x_{op}$:
    $$\Delta{x} = x_{op} - x_{op} = 0$$
    
    The second term drops out in the linearisation formula leaving the above equality.
  </subsubsection>
