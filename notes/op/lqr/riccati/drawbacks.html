<chapter style="counter-reset: chapter 0"><h1>Drawbacks</h1>
  It is not able to reason about constraints on a system such as actuator limits or safety constraints. 
  
  <p>
    The Ricatti solution for an LQR is a back substitution solution for a QP. If other constraints are added to the QP, it changes the block structure and breaks the Riccati solution.
  </p>
