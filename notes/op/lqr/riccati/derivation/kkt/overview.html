<chapter style="counter-reset: chapter 0"><h1>Steps</h1>
  Assuming a deterministic optimal control problem satisfies the <a href="intro.html">LQR criteria</a>, it can be solved in the following way:
  <ul>
    <li>Reformulate the problem as a <a href="../intro/main.html">QP</a></li>
    <li>Then, stack as a KKT linear system</li>
    <li>Solve using any of the following methods:</li>
    <ul>
      <li>Newton's method <n>in a single iteration</n></li>
      
    </ul>
  </ul>
