<chapter style="counter-reset: chapter 0"><h1>Body control</h1>
  $V^{G_{c_k}}$ needs to be expressed in the wheel and joint space using the pseudoinverse of the mobile manipulator jacobian. The commanded wheel and joint speeds are given by:

  $$
    \begin{bmatrix}u \\ \dot{\theta} \end{bmatrix} = 
    J^{\dagger}_{e}(\theta) \, V^{G_{c_k}}
  $$
