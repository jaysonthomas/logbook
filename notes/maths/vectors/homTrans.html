<chapter style="counter-reset: chapter 3"><h1>Homogeneous transformation</h1>
  <i>Homogeneous transforms</i> also allow shearing and scaling. For a Rigid Pose, the rotation matrix is strictly orthonormal. For a general homogeneous affine transformation, the rotation part can be can be any invertible $3 \times 3$ linear transformation matrix.
